<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic alo - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="brand">Islamic alo</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <div class="glass-avatar" title="Islamic alo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12.75 2.5a9.5 9.5 0 1 0 8.75 13.25A8 8 0 0 1 12.75 2.5z"/>
                    <path d="M18.5 4.5l.65 1.35 1.45.2-1.05 1.02.25 1.45-1.3-.7-1.3.7.25-1.45-1.05-1.02 1.45-.2L18.5 4.5z"/>
                </svg>
            </div>
            <h1>Islamic alo</h1>
            <p style="margin: 6px 0; font-size: 14px;">
                <strong id="followerCount">0</strong> Followers • <strong id="videoCount">0</strong> Videos
            </p>
            <button id="followBtn" class="btn btn-accent" onclick="handleFollowClick()">+ Follow</button>
        </section>

        <div class="sort-bar">
            <button id="btnLatest" class="sort-btn active" onclick="setSortOrder('latest')">Latest</button>
            <button id="btnOldest" class="sort-btn" onclick="setSortOrder('oldest')">Oldest</button>
        </div>

        <div class="video-grid-3" id="profileVideos"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script>
        const LOCAL_VIDEOS_KEY = "ia_local_videos_v1";
        const FOLLOW_COUNT_KEY = "ia_follow_count_v1";
        let currentSort = "latest";
        let profileVideos = [];

        function getFollowCount() {
            return parseInt(localStorage.getItem(FOLLOW_COUNT_KEY) || "0", 10) || 0;
        }

        function setFollowCount(n) {
            localStorage.setItem(FOLLOW_COUNT_KEY, String(Math.max(0, n)));
            document.getElementById("followerCount").innerText = getFollowCount();
        }

        function handleFollowClick() {
            const next = getFollowCount() + 1;
            setFollowCount(next);
            const btn = document.getElementById("followBtn");
            btn.innerText = "✓ Following (" + next + ")";
        }

        function setSortOrder(order) {
            currentSort = order;
            document.getElementById("btnLatest").classList.toggle("active", order === "latest");
            document.getElementById("btnOldest").classList.toggle("active", order === "oldest");
            renderProfileVideos();
        }

        async function loadProfileVideos() {
            let localVids = [];
            try {
                const raw = localStorage.getItem(LOCAL_VIDEOS_KEY);
                localVids = raw ? JSON.parse(raw) : [];
            } catch (e) {
                localVids = [];
            }

            let cloudVids = [];
            if (typeof fbDb !== "undefined" && fbDb) {
                try {
                    const snap = await fbDb.collection("videos").get();
                    cloudVids = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (e) {
                    cloudVids = [];
                }
            }

            const merged = new Map();
            [...cloudVids, ...localVids].forEach(item => {
                if (item && item.id) {
                    const prev = merged.get(item.id) || {};
                    merged.set(item.id, { ...prev, ...item });
                }
            });

            profileVideos = Array.from(merged.values()).filter(v => !v.hidden);
            renderProfileVideos();
        }

        function renderProfileVideos() {
            let list = [...profileVideos];
            if (currentSort === "oldest") {
                list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            } else {
                list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }

            document.getElementById("videoCount").innerText = list.length;
            const grid = document.getElementById("profileVideos");
            grid.innerHTML = "";

            if (list.length === 0) {
                grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><p style="color: var(--muted);">কোনো ভিডিও পাওয়া যায়নি।</p></div>`;
                return;
            }

            list.forEach((vid, idx) => {
                const tile = document.createElement("div");
                tile.className = "grid-tile";
                tile.style.animationDelay = `${Math.min(idx * 45, 300)}ms`;

                if (vid.src) {
                    const videoEl = document.createElement("video");
                    videoEl.src = vid.src;
                    videoEl.controls = true;
                    videoEl.playsInline = true;
                    videoEl.preload = "metadata";
                    tile.appendChild(videoEl);
                } else {
                    tile.style.background = "#0f172a";
                    tile.style.display = "flex";
                    tile.style.alignItems = "center";
                    tile.style.justifyContent = "center";
                    tile.style.color = "#ffffff";
                    tile.style.padding = "12px";
                    tile.style.textAlign = "center";
                    tile.innerText = vid.title || vid.fileName || "Video";
                }

                const overlay = document.createElement("div");
                overlay.className = "grid-tile-overlay";
                overlay.innerText = vid.title || "Video";
                tile.appendChild(overlay);
                grid.appendChild(tile);
            });
        }

        document.getElementById("followerCount").innerText = getFollowCount();
        loadProfileVideos();
    </script>
</body>
</html>
