<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic alo - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .admin-banner {
            background: linear-gradient(135deg, rgba(17, 94, 89, 0.92), rgba(15, 118, 110, 0.88));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 12px 26px rgba(15, 118, 110, 0.16);
            animation: smoothFadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 14px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .stat-box strong {
            display: block;
            font-size: 19px;
        }
        .stat-box span {
            font-size: 11px;
            opacity: 0.92;
        }

        /* ছোট কল্যাপসিবল সেকশন বার */
        .compact-bar-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
            margin-bottom: 12px;
            animation: smoothFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .compact-bar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .compact-bar-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mini-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            border: 1px solid rgba(15, 118, 110, 0.25);
            background: rgba(240, 253, 244, 0.95);
            color: #0f766e;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.22s ease;
        }
        .mini-toggle-btn:hover {
            transform: scale(1.07);
            background: #ccfbf1;
        }
        .mini-toggle-btn:active {
            transform: scale(0.94);
        }
        .mini-toggle-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        .collapsible-body {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.28);
            animation: glassPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .collapsible-body.open {
            display: block;
        }

        .dash-compact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 720px) {
            .dash-compact-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
        }
        .dash-mini-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 9px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
            animation: glassPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s ease;
        }
        .dash-mini-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 22px rgba(15, 23, 42, 0.1);
        }
        .dash-mini-video {
            width: 100%;
            height: 125px;
            border-radius: 10px;
            background: #0f172a;
            object-fit: cover;
            display: block;
        }
        .dash-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: 7px;
        }
        .dash-mini-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .qr-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid rgba(15, 118, 110, 0.25);
            background: rgba(240, 253, 244, 0.9);
            color: #0f766e;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.22s ease;
        }
        .qr-icon-btn:hover {
            transform: scale(1.08);
            background: #ccfbf1;
        }
        .qr-icon-btn:active {
            transform: scale(0.94);
        }
        .qr-icon-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .qr-menu-drawer {
            display: none;
            margin-top: 8px;
            padding: 8px;
            background: rgba(240, 253, 244, 0.92);
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            text-align: center;
            animation: glassPop 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .qr-menu-drawer.open {
            display: block;
        }
        .qr-mini-frame {
            display: inline-flex;
            padding: 5px;
            background: #ffffff;
            border-radius: 8px;
            margin: 4px auto;
        }
        .qr-mini-actions {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .dash-mini-footer {
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px solid rgba(148, 163, 184, 0.28);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="brand">Islamic alo</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="followers.html">Followers</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logoutAdmin()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-banner">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div>
                    <span class="badge badge-qr" style="margin-top: 0; margin-bottom: 6px;">ISLAMIC ALO ADMIN</span>
                    <h2 style="font-size: 20px;">স্বাগতম, Islamic alo</h2>
                    <p id="activeAdminEmailText" style="font-size: 12px; opacity: 0.9; margin-top: 2px;"></p>
                </div>
                <a href="followers.html" class="btn btn-accent btn-sm">Followers তালিকা</a>
            </div>

            <div class="admin-stats">
                <div class="stat-box">
                    <strong id="dashVideoCount">0</strong>
                    <span>মোট ভিডিও</span>
                </div>
                <div class="stat-box">
                    <strong id="dashFollowerCount">0</strong>
                    <span>মোট ফলোয়ার</span>
                </div>
            </div>
        </div>

        <!-- ছোট মেনু/আইকন: Admin Email ও Password পরিবর্তন -->
        <div class="compact-bar-card">
            <div class="compact-bar-header">
                <div class="compact-bar-title">
                    <span>⚙️ Admin Email ও Password পরিবর্তন</span>
                </div>
                <button type="button" class="mini-toggle-btn" title="খুলুন / বন্ধ করুন" onclick="toggleSection('credSection')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                    </svg>
                </button>
            </div>
            <div id="credSection" class="collapsible-body">
                <div class="form-group">
                    <label>নতুন Admin Email</label>
                    <input type="email" id="newAdminEmail" required>
                </div>
                <div class="form-group">
                    <label>নতুন Password</label>
                    <input type="text" id="newAdminPassword" required>
                </div>
                <button type="button" class="btn btn-dark btn-sm" onclick="updateAdminCredentials()">পরিবর্তন সেভ করুন</button>
                <p id="credMsg" style="font-size: 13px; color: var(--success); margin-top: 8px;"></p>
            </div>
        </div>

        <!-- ছোট মেনু/আইকন: নতুন ভিডিও আপলোড -->
        <div class="compact-bar-card">
            <div class="compact-bar-header">
                <div class="compact-bar-title">
                    <span>নতুন ভিডিও আপলোড</span>
                </div>
                <button type="button" class="mini-toggle-btn" title="আপলোড মেনু খুলুন / বন্ধ করুন" onclick="toggleSection('uploadSection')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                </button>
            </div>
            <div id="uploadSection" class="collapsible-body">
                <div class="form-group">
                    <label>ভিডিওর শিরোনাম (Title)</label>
                    <input type="text" id="vidTitle" placeholder="ভিডিওর নাম লিখুন...">
                </div>
                <div class="form-group">
                    <label>ভিডিওর ধরন বেছে নিন (২টি ভাগ)</label>
                    <select id="vidType">
                        <option value="qr">১. QR Code ভিডিও (HD QR কোড তৈরি হবে + ৩০ দিন মেয়াদ)</option>
                        <option value="profile">২. Profile ভিডিও (শুধু প্রোফাইলে থাকবে, QR কোড হবে না)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ভিডিও ফাইল নির্বাচন করুন</label>
                    <input type="file" id="vidFile" accept="video/*">
                </div>
                <button type="button" class="btn btn-primary" onclick="handleUpload()">ভিডিও প্রকাশ করুন</button>
            </div>
        </div>

        <h3 style="margin-bottom: 12px; margin-top: 14px; color: var(--primary-dark);">আপলোডকৃত ভিডিওসমূহ (আপনার নিয়ন্ত্রণে)</h3>
        <div class="dash-compact-grid" id="adminVideoGrid"></div>
    </div>

    <!-- Glass Delete Modal -->
    <div id="deleteConfirmModal" class="glass-modal-backdrop">
        <div class="glass-modal-box">
            <h3 style="color: var(--danger); margin-bottom: 6px;">ভিডিও ডিলিট নিশ্চিত করুন</h3>
            <p id="deleteModalText" style="font-size: 13px; color: var(--text); margin-bottom: 16px;">
                এই ভিডিওটি ডিলিট করতে চান?
            </p>
            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button type="button" class="btn btn-glass btn-sm" style="color: var(--text); border-color: #cbd5e1;" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteVideo()">Delete</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        checkAdminAuth();

        const currentAdmin = getAdminConfig();
        document.getElementById("newAdminEmail").value = currentAdmin.email;
        document.getElementById("newAdminPassword").value = currentAdmin.password;
        document.getElementById("activeAdminEmailText").innerText = "লগইন অ্যাকাউন্ট: " + currentAdmin.email;
        document.getElementById("dashFollowerCount").innerText = getFollowers().length;

        function toggleSection(sectionId) {
            const el = document.getElementById(sectionId);
            if (el) {
                el.classList.toggle("open");
            }
        }

        function updateStats() {
            document.getElementById("dashVideoCount").innerText = getVideos().length;
            document.getElementById("dashFollowerCount").innerText = getFollowers().length;
        }

        function updateAdminCredentials() {
            const email = document.getElementById("newAdminEmail").value.trim();
            const pass = document.getElementById("newAdminPassword").value.trim();

            if (!email || !email.includes("@") || !pass) {
                alert("সঠিক ইমেইল এবং পাসওয়ার্ড দিন!");
                return;
            }

            saveAdminConfig(email, pass);
            document.getElementById("activeAdminEmailText").innerText = "লগইন অ্যাকাউন্ট: " + email;
            document.getElementById("credMsg").innerText = "✓ নতুন ইমেইল ও পাসওয়ার্ড সফলভাবে সেভ হয়েছে!";
        }

        function logoutAdmin() {
            sessionStorage.removeItem("ia_is_admin");
            window.location.href = "admin.html";
        }

        function toggleQrMenu(videoId) {
            const drawer = document.getElementById("qr-drawer-" + videoId);
            if (drawer) {
                drawer.classList.toggle("open");
            }
        }

        async function handleUpload() {
            const title = document.getElementById("vidTitle").value.trim();
            const type = document.getElementById("vidType").value;
            const fileInput = document.getElementById("vidFile");

            if (!title || !fileInput.files[0]) {
                alert("শিরোনাম এবং ভিডিও ফাইল দুটোই দিতে হবে!");
                return;
            }

            const selectedFile = fileInput.files[0];
            const vidId = "vid_" + Date.now();
            const tempUrl = URL.createObjectURL(selectedFile);

            await saveVideoBlobToDB(vidId, selectedFile);

            const videos = getVideos();
            videos.unshift({
                id: vidId,
                title: title,
                type: type,
                url: tempUrl,
                hidden: false,
                createdAt: Date.now()
            });

            saveVideos(videos);
            document.getElementById("vidTitle").value = "";
            fileInput.value = "";
            updateStats();
            renderAdminVideos();
        }

        function toggleVideoVisibility(id) {
            const videos = getVideos();
            const target = videos.find(v => v.id === id);
            if (target) {
                target.hidden = !target.hidden;
                saveVideos(videos);
                renderAdminVideos();
            }
        }

        let pendingDeleteId = null;

        function deleteVideo(id) {
            const videos = getVideos();
            const target = videos.find(v => v.id === id);
            pendingDeleteId = id;
            document.getElementById("deleteModalText").innerText = target
                ? `"${target.title}" ভিডিওটি স্থায়ীভাবে ডিলিট করতে চান?`
                : "এই ভিডিওটি স্থায়ীভাবে ডিলিট করতে চান?";
            document.getElementById("deleteConfirmModal").classList.add("open");
        }

        function closeDeleteModal() {
            pendingDeleteId = null;
            document.getElementById("deleteConfirmModal").classList.remove("open");
        }

        async function confirmDeleteVideo() {
            if (!pendingDeleteId) return;
            const idToRemove = pendingDeleteId;
            closeDeleteModal();
            await deleteVideoBlobFromDB(idToRemove);
            const videos = getVideos().filter(v => v.id !== idToRemove);
            saveVideos(videos);
            updateStats();
            renderAdminVideos();
        }

        function drawRoundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function downloadHighResQR(videoId, encodedTitle) {
            const title = decodeURIComponent(encodedTitle || "Islamic alo Video");
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
            const fullVideoUrl = baseUrl + "video.html?v=" + videoId;

            const tempHolder = document.createElement("div");
            tempHolder.style.position = "fixed";
            tempHolder.style.left = "-9999px";
            document.body.appendChild(tempHolder);

            new QRCode(tempHolder, {
                text: fullVideoUrl,
                width: 600,
                height: 600,
                colorDark: "#0f172a",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const qrCanvas = tempHolder.querySelector("canvas");
                const qrImg = tempHolder.querySelector("img");

                const hdCanvas = document.createElement("canvas");
                hdCanvas.width = 800;
                hdCanvas.height = 1020;
                const ctx = hdCanvas.getContext("2d");
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";

                const bgGrad = ctx.createLinearGradient(0, 0, 800, 1020);
                bgGrad.addColorStop(0, "#f0fdf4");
                bgGrad.addColorStop(1, "#ecfeff");
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 800, 1020);

                drawRoundRect(ctx, 45, 45, 710, 930, 36);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#0f766e";
                ctx.stroke();

                drawRoundRect(ctx, 250, 90, 300, 52, 26);
                ctx.fillStyle = "#0f766e";
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("ISLAMIC ALO", 400, 124);

                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 30px sans-serif";
                const shortTitle = title.length > 34 ? title.slice(0, 34) + "..." : title;
                ctx.fillText(shortTitle, 400, 195);

                drawRoundRect(ctx, 130, 230, 540, 540, 28);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#cbd5e1";
                ctx.stroke();

                const finishDownload = (source) => {
                    ctx.drawImage(source, 160, 260, 480, 480);

                    ctx.fillStyle = "#0f766e";
                    ctx.font = "bold 24px sans-serif";
                    ctx.fillText("Scan QR Code to Watch Video", 400, 825);

                    ctx.fillStyle = "#64748b";
                    ctx.font = "20px sans-serif";
                    ctx.fillText("Valid for 30 Days • No Login Required", 400, 868);

                    ctx.fillStyle = "#94a3b8";
                    ctx.font = "16px sans-serif";
                    ctx.fillText("Islamic alo Official QR Pass", 400, 925);

                    const safeName = title.replace(/[^a-zA-Z0-9_-]/g, "_");
                    const link = document.createElement("a");
                    link.download = `islamic-alo-HD-QR-${safeName || videoId}.png`;
                    link.href = hdCanvas.toDataURL("image/png", 1.0);
                    link.click();

                    document.body.removeChild(tempHolder);
                };

                if (qrCanvas) {
                    finishDownload(qrCanvas);
                } else if (qrImg) {
                    const imageObj = new Image();
                    imageObj.crossOrigin = "anonymous";
                    imageObj.onload = () => finishDownload(imageObj);
                    imageObj.src = qrImg.src;
                } else {
                    document.body.removeChild(tempHolder);
                    alert("HD QR তৈরি করতে সমস্যা হয়েছে।");
                }
            }, 150);
        }

        async function renderAdminVideos() {
            const videos = getVideos();
            updateStats();
            const grid = document.getElementById("adminVideoGrid");
            grid.innerHTML = "";

            if (videos.length === 0) {
                grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><p style="color: var(--muted);">এখনো কোনো ভিডিও আপলোড করা হয়নি।</p></div>`;
                return;
            }

            for (let idx = 0; idx < videos.length; idx++) {
                const vid = videos[idx];
                const playableUrl = await getVideoUrlFromDB(vid.id, vid.url);
                const expired = vid.type === "qr" && isVideoExpired(vid.createdAt);
                const card = document.createElement("div");
                card.className = "dash-mini-card";
                card.style.animationDelay = `${Math.min(idx * 40, 240)}ms`;

                let badges = vid.type === "qr"
                    ? `<span class="badge badge-qr">QR (৩০ দিন)</span>`
                    : `<span class="badge badge-profile">Profile</span>`;

                if (vid.hidden) {
                    badges += ` <span class="badge badge-hidden">Hidden</span>`;
                }
                if (expired) {
                    badges += ` <span class="badge badge-hidden">মেয়াদ শেষ</span>`;
                }

                const qrIconButtonHtml = vid.type === "qr" ? `
                    <button type="button" class="qr-icon-btn" title="QR Menu" onclick="toggleQrMenu('${vid.id}')">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm10 0h2v2h-2v-2zm4 0h2v4h-2v-4zm-4 4h2v2h-2v-2zm2 2h4v2h-4v-2z"/>
                        </svg>
                    </button>
                ` : "";

                const qrDrawerHtml = vid.type === "qr" ? `
                    <div id="qr-drawer-${vid.id}" class="qr-menu-drawer">
                        <div style="font-size: 11px; font-weight: 700; color: #0f766e;">QR Menu</div>
                        <div class="qr-mini-frame">
                            <div id="qrcode-${vid.id}"></div>
                        </div>
                        <div class="qr-mini-actions">
                            <button type="button" class="btn btn-success btn-sm" onclick="downloadHighResQR('${vid.id}', '${encodeURIComponent(vid.title)}')">HD QR</button>
                            <a href="video.html?v=${vid.id}" target="_blank" class="btn btn-primary btn-sm">খুলুন</a>
                        </div>
                    </div>
                ` : "";

                card.innerHTML = `
                    <video class="dash-mini-video" src="${playableUrl}" controls playsinline preload="metadata"></video>
                    <div class="dash-title-row">
                        <div class="dash-mini-title" title="${vid.title}">${vid.title}</div>
                        ${qrIconButtonHtml}
                    </div>
                    <div>${badges}</div>
                    ${qrDrawerHtml}
                    <div class="dash-mini-footer">
                        <span style="font-size: 11px; color: var(--muted);">স্ট্যাটাস: <strong>${vid.hidden ? "Off" : "On"}</strong></span>
                        <button type="button" class="btn btn-sm ${vid.hidden ? "btn-success" : "btn-primary"}" style="width: 100%;" onclick="toggleVideoVisibility('${vid.id}')">
                            ${vid.hidden ? "On করুন" : "Hide করুন"}
                        </button>
                        <button type="button" class="btn btn-sm btn-danger" style="width: 100%;" onclick="deleteVideo('${vid.id}')">
                            Delete
                        </button>
                    </div>
                `;
                grid.appendChild(card);

                if (vid.type === "qr") {
                    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
                    const fullVideoUrl = baseUrl + "video.html?v=" + vid.id;
                    new QRCode(document.getElementById("qrcode-" + vid.id), {
                        text: fullVideoUrl,
                        width: 82,
                        height: 82,
                        colorDark: "#0f172a",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            }
        }

        renderAdminVideos();
    </script>
</body>
</html>
