<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic alo - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .admin-banner {
            background: linear-gradient(135deg, rgba(17, 94, 89, 0.92), rgba(15, 118, 110, 0.88));
            color: #ffffff;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 12px 26px rgba(15, 118, 110, 0.16);
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 14px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .stat-box strong {
            display: block;
            font-size: 19px;
        }
        .stat-box span {
            font-size: 11px;
            opacity: 0.92;
        }
        .compact-bar-card {
            background: var(--card);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
            margin-bottom: 12px;
        }
        .compact-bar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .compact-bar-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-dark);
        }
        .mini-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            border: 1px solid rgba(15, 118, 110, 0.25);
            background: rgba(240, 253, 244, 0.95);
            color: #0f766e;
            cursor: pointer;
        }
        .mini-toggle-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        .collapsible-body {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.28);
        }
        .collapsible-body.open {
            display: block;
        }
        .upload-progress-box {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 12px;
            background: #f0fdfa;
            border: 1px solid #99f6e4;
        }
        .upload-progress-box.active {
            display: block;
        }
        .upload-progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: #0f766e;
            margin-bottom: 6px;
        }
        .upload-progress-track {
            width: 100%;
            height: 9px;
            background: #ccfbf1;
            border-radius: 999px;
            overflow: hidden;
        }
        .upload-progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0d9488, #14b8a6);
            border-radius: 999px;
            transition: width 0.2s ease;
        }
        .dash-compact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 720px) {
            .dash-compact-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
        }
        .dash-mini-card {
            background: var(--card);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 9px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
        }
        .dash-mini-video {
            width: 100%;
            height: 135px;
            border-radius: 10px;
            background: #0f172a;
            object-fit: cover;
            display: block;
        }
        .dash-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: 7px;
        }
        .dash-mini-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .qr-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid rgba(15, 118, 110, 0.25);
            background: rgba(240, 253, 244, 0.9);
            color: #0f766e;
            cursor: pointer;
        }
        .qr-icon-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }
        .qr-box-inline {
            margin-top: 8px;
            padding: 8px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            text-align: center;
        }
        .qr-mini-frame {
            display: inline-flex;
            padding: 5px;
            background: #ffffff;
            border-radius: 8px;
            margin: 4px auto;
        }
        .dash-mini-footer {
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px solid rgba(148, 163, 184, 0.28);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="brand">Islamic alo</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="followers.html">Followers</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logoutAdmin()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-banner">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div>
                    <span class="badge badge-qr" style="margin-top: 0; margin-bottom: 6px;">ISLAMIC ALO ADMIN</span>
                    <h2 style="font-size: 20px;">স্বাগতম, Islamic alo</h2>
                    <p id="activeAdminEmailText" style="font-size: 12px; opacity: 0.9; margin-top: 2px;">অ্যাডমিন প্যানেল</p>
                </div>
                <a href="followers.html" class="btn btn-accent btn-sm">Followers তালিকা</a>
            </div>

            <div class="admin-stats">
                <div class="stat-box">
                    <strong id="dashVideoCount">0</strong>
                    <span>মোট ভিডিও</span>
                </div>
                <div class="stat-box">
                    <strong id="dashFollowerCount">0</strong>
                    <span>মোট ফলোয়ার</span>
                </div>
            </div>
        </div>

        <div class="compact-bar-card">
            <div class="compact-bar-header">
                <div class="compact-bar-title">
                    <span>নতুন ভিডিও আপলোড</span>
                </div>
                <button type="button" class="mini-toggle-btn" title="খুলুন / বন্ধ করুন" onclick="toggleSection('uploadSection')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                </button>
            </div>
            <div id="uploadSection" class="collapsible-body open">
                <div class="form-group">
                    <label>ভিডিওর শিরোনাম (Title)</label>
                    <input type="text" id="vidTitle" placeholder="ভিডিওর নাম লিখুন...">
                </div>
                <div class="form-group">
                    <label>ভিডিওর ধরন বেছে নিন</label>
                    <select id="vidType">
                        <option value="profile">Profile ভিডিও (প্রোফাইলে দেখাবে)</option>
                        <option value="qr">QR Code ভিডিও (QR কোড তৈরি হবে)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ভিডিও ফাইল নির্বাচন করুন</label>
                    <input type="file" id="vidFile" accept="video/*">
                </div>
                <button type="button" id="uploadSubmitBtn" class="btn btn-primary" onclick="handleUpload()">ভিডিও প্রকাশ করুন</button>

                <div id="uploadProgressBox" class="upload-progress-box">
                    <div class="upload-progress-top">
                        <span id="uploadStatusText">আপলোড হচ্ছে...</span>
                        <span id="uploadPercentText">0%</span>
                    </div>
                    <div class="upload-progress-track">
                        <div id="uploadProgressFill" class="upload-progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <h3 style="margin-bottom: 12px; margin-top: 14px; color: var(--primary-dark);">আপলোডকৃত ভিডিওসমূহ</h3>
        <div class="dash-compact-grid" id="adminVideoGrid"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script>
        const LOCAL_VIDEOS_KEY = "ia_local_videos_v1";
        const LOCAL_BLOBS = {};
        let videosList = [];

        if (typeof fbAuth !== "undefined" && fbAuth) {
            fbAuth.onAuthStateChanged((user) => {
                if (user && user.email) {
                    document.getElementById("activeAdminEmailText").innerText = "লগইন অ্যাকাউন্ট: " + user.email;
                }
            });
        }

        function setUploadProgress(percent, statusText) {
            const box = document.getElementById("uploadProgressBox");
            const fill = document.getElementById("uploadProgressFill");
            const pctEl = document.getElementById("uploadPercentText");
            const statusEl = document.getElementById("uploadStatusText");
            box.classList.add("active");
            const pct = Math.max(0, Math.min(100, Math.round(percent)));
            fill.style.width = pct + "%";
            pctEl.innerText = pct + "%";
            if (statusText) statusEl.innerText = statusText;
        }

        function readLocalVideos() {
            try {
                const raw = localStorage.getItem(LOCAL_VIDEOS_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function writeLocalVideos(arr) {
            try {
                localStorage.setItem(LOCAL_VIDEOS_KEY, JSON.stringify(arr));
            } catch (e) {}
        }

        async function loadAllVideos() {
            const localVids = readLocalVideos();
            let cloudVids = [];
            if (typeof fbDb !== "undefined" && fbDb) {
                try {
                    const snap = await fbDb.collection("videos").get();
                    cloudVids = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (e) {
                    cloudVids = [];
                }
            }

            const mergedMap = new Map();
            [...cloudVids, ...localVids].forEach(item => {
                if (item && item.id) {
                    const prev = mergedMap.get(item.id) || {};
                    mergedMap.set(item.id, { ...prev, ...item });
                }
            });

            videosList = Array.from(mergedMap.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            document.getElementById("dashVideoCount").innerText = videosList.length;
            renderAdminVideos();
        }

        function toggleSection(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle("open");
        }

        async function logoutAdmin() {
            sessionStorage.removeItem("ia_is_admin");
            if (typeof signOutUser === "function") {
                try { await signOutUser(); } catch (e) {}
            }
            window.location.href = "admin.html";
        }

        function fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onprogress = (ev) => {
                    if (ev.lengthComputable) {
                        const pct = 15 + Math.round((ev.loaded / ev.total) * 55);
                        setUploadProgress(pct, "ভিডিও ফাইল প্রসেস হচ্ছে...");
                    }
                };
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handleUpload() {
            const titleInput = document.getElementById("vidTitle");
            const typeSelect = document.getElementById("vidType");
            const fileInput = document.getElementById("vidFile");
            const btn = document.getElementById("uploadSubmitBtn");

            const title = titleInput.value.trim() || "Islamic alo Video";
            const type = typeSelect.value || "profile";
            const file = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
            const vidId = "vid_" + Date.now();

            btn.disabled = true;
            setUploadProgress(15, "আপলোড শুরু হচ্ছে...");

            let playableSrc = "";
            let dataUrlForStorage = "";

            if (file) {
                playableSrc = URL.createObjectURL(file);
                LOCAL_BLOBS[vidId] = playableSrc;
                if (file.size <= 1500000) {
                    try {
                        dataUrlForStorage = await fileToDataUrl(file);
                    } catch (e) {
                        dataUrlForStorage = "";
                    }
                } else {
                    setUploadProgress(70, "ভিডিও প্রস্তুত হচ্ছে...");
                }
            }

            const newVideo = {
                id: vidId,
                title: title,
                type: type,
                fileName: file ? file.name : "",
                src: dataUrlForStorage || playableSrc || "",
                hidden: false,
                createdAt: Date.now()
            };

            const existingLocal = readLocalVideos().filter(v => v.id !== vidId);
            existingLocal.unshift(newVideo);
            writeLocalVideos(existingLocal);

            setUploadProgress(88, "সংরক্ষণ হচ্ছে...");
            if (typeof fbDb !== "undefined" && fbDb) {
                try {
                    await fbDb.collection("videos").doc(vidId).set({
                        id: vidId,
                        title: title,
                        type: type,
                        fileName: file ? file.name : "",
                        src: dataUrlForStorage || "",
                        hidden: false,
                        createdAt: newVideo.createdAt
                    });
                } catch (e) {}
            }

            setUploadProgress(100, "✓ ১০০% আপলোড সম্পন্ন হয়েছে!");
            titleInput.value = "";
            fileInput.value = "";
            await loadAllVideos();
            btn.disabled = false;
        }

        async function toggleVideoVisibility(id) {
            const target = videosList.find(v => v.id === id);
            if (!target) return;
            const nextHidden = !target.hidden;
            target.hidden = nextHidden;

            const localVids = readLocalVideos().map(v => v.id === id ? { ...v, hidden: nextHidden } : v);
            writeLocalVideos(localVids);

            if (typeof fbDb !== "undefined" && fbDb) {
                try { await fbDb.collection("videos").doc(id).update({ hidden: nextHidden }); } catch (e) {}
            }
            await loadAllVideos();
        }

        async function deleteVideo(id) {
            const localVids = readLocalVideos().filter(v => v.id !== id);
            writeLocalVideos(localVids);
            if (typeof fbDb !== "undefined" && fbDb) {
                try { await fbDb.collection("videos").doc(id).delete(); } catch (e) {}
            }
            await loadAllVideos();
        }

        function renderAdminVideos() {
            const grid = document.getElementById("adminVideoGrid");
            grid.innerHTML = "";

            if (videosList.length === 0) {
                grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><p style="color: var(--muted);">এখনো কোনো ভিডিও আপলোড করা হয়নি।</p></div>`;
                return;
            }

            videosList.forEach((vid) => {
                const videoSrc = LOCAL_BLOBS[vid.id] || vid.src || "";
                const card = document.createElement("div");
                card.className = "dash-mini-card";

                let badges = vid.type === "qr"
                    ? `<span class="badge badge-qr">QR Code</span>`
                    : `<span class="badge badge-profile">Profile</span>`;
                if (vid.hidden) badges += ` <span class="badge badge-hidden">Hidden</span>`;

                const mediaHtml = videoSrc
                    ? `<video class="dash-mini-video" src="${videoSrc}" controls playsinline preload="metadata"></video>`
                    : `<div class="dash-mini-video" style="display:flex;align-items:center;justify-content:center;color:#e2e8f0;font-size:11px;padding:8px;text-align:center;">
                        ${vid.fileName || vid.title}
                       </div>`;

                const qrSectionHtml = vid.type === "qr" ? `
                    <div class="qr-box-inline">
                        <div style="font-size: 11px; font-weight: 700; color: #0f766e;">QR Code</div>
                        <div class="qr-mini-frame">
                            <div id="qrcode-${vid.id}"></div>
                        </div>
                    </div>
                ` : "";

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="dash-title-row">
                        <div class="dash-mini-title" title="${vid.title}">${vid.title}</div>
                        ${vid.type === "qr" ? `<span class="qr-icon-btn" title="QR"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm10 0h2v2h-2v-2zm4 0h2v4h-2v-4zm-4 4h2v2h-2v-2zm2 2h4v2h-4v-2z"/></svg></span>` : ""}
                    </div>
                    <div>${badges}</div>
                    ${qrSectionHtml}
                    <div class="dash-mini-footer">
                        <button type="button" class="btn btn-sm ${vid.hidden ? "btn-success" : "btn-primary"}" style="width: 100%;" onclick="toggleVideoVisibility('${vid.id}')">
                            ${vid.hidden ? "On করুন" : "Hide করুন"}
                        </button>
                        <button type="button" class="btn btn-sm btn-danger" style="width: 100%;" onclick="deleteVideo('${vid.id}')">
                            Delete
                        </button>
                    </div>
                `;
                grid.appendChild(card);

                if (vid.type === "qr" && typeof QRCode !== "undefined") {
                    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
                    const qrTargetUrl = baseUrl + "video.html?v=" + vid.id;
                    new QRCode(document.getElementById("qrcode-" + vid.id), {
                        text: qrTargetUrl,
                        width: 90,
                        height: 90,
                        colorDark: "#0f172a",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                }
            });
        }

        loadAllVideos();
    </script>
</body>
</html>
