<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic alo - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .admin-banner {
            background: linear-gradient(135deg, rgba(17, 94, 89, 0.92), rgba(15, 118, 110, 0.88));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 12px 26px rgba(15, 118, 110, 0.16);
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 14px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .stat-box strong {
            display: block;
            font-size: 19px;
        }
        .stat-box span {
            font-size: 11px;
            opacity: 0.92;
        }
        .compact-bar-card {
            background: var(--card);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
            margin-bottom: 12px;
        }
        .compact-bar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .compact-bar-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-dark);
        }
        .mini-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            border: 1px solid rgba(15, 118, 110, 0.25);
            background: rgba(240, 253, 244, 0.95);
            color: #0f766e;
            cursor: pointer;
        }
        .mini-toggle-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        .collapsible-body {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.28);
        }
        .collapsible-body.open {
            display: block;
        }
        .upload-progress-box {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 12px;
            background: #f0fdfa;
            border: 1px solid #99f6e4;
        }
        .upload-progress-box.active {
            display: block;
        }
        .upload-progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: #0f766e;
            margin-bottom: 6px;
        }
        .upload-progress-track {
            width: 100%;
            height: 9px;
            background: #ccfbf1;
            border-radius: 999px;
            overflow: hidden;
        }
        .upload-progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0d9488, #14b8a6);
            border-radius: 999px;
            transition: width 0.22s ease;
        }
        .dash-compact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 720px) {
            .dash-compact-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
        }
        .dash-mini-card {
            background: var(--card);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 9px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
        }
        .dash-mini-video {
            width: 100%;
            height: 125px;
            border-radius: 10px;
            background: #0f172a;
            object-fit: cover;
            display: block;
        }
        .dash-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: 7px;
        }
        .dash-mini-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .qr-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid rgba(15, 118, 110, 0.25);
            background: rgba(240, 253, 244, 0.9);
            color: #0f766e;
            cursor: pointer;
        }
        .qr-icon-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }
        .qr-menu-drawer {
            display: none;
            margin-top: 8px;
            padding: 8px;
            background: rgba(240, 253, 244, 0.92);
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            text-align: center;
        }
        .qr-menu-drawer.open {
            display: block;
        }
        .qr-mini-frame {
            display: inline-flex;
            padding: 5px;
            background: #ffffff;
            border-radius: 8px;
            margin: 4px auto;
        }
        .dash-mini-footer {
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px solid rgba(148, 163, 184, 0.28);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="brand">Islamic alo</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="followers.html">Followers</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logoutAdmin()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-banner">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div>
                    <span class="badge badge-qr" style="margin-top: 0; margin-bottom: 6px;">ISLAMIC ALO ADMIN</span>
                    <h2 style="font-size: 20px;">স্বাগতম, Islamic alo</h2>
                    <p id="activeAdminEmailText" style="font-size: 12px; opacity: 0.9; margin-top: 2px;">অ্যাকাউন্ট যাচাই হচ্ছে...</p>
                </div>
                <a href="followers.html" class="btn btn-accent btn-sm">Followers তালিকা</a>
            </div>

            <div class="admin-stats">
                <div class="stat-box">
                    <strong id="dashVideoCount">0</strong>
                    <span>মোট ভিডিও</span>
                </div>
                <div class="stat-box">
                    <strong id="dashFollowerCount">0</strong>
                    <span>মোট ফলোয়ার</span>
                </div>
            </div>
        </div>

        <div class="compact-bar-card">
            <div class="compact-bar-header">
                <div class="compact-bar-title">
                    <span>নতুন ভিডিও আপলোড</span>
                </div>
                <button type="button" class="mini-toggle-btn" title="আপলোড মেনু খুলুন / বন্ধ করুন" onclick="toggleSection('uploadSection')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                </button>
            </div>
            <div id="uploadSection" class="collapsible-body open">
                <div class="form-group">
                    <label>ভিডিওর শিরোনাম (Title)</label>
                    <input type="text" id="vidTitle" placeholder="ভিডিওর নাম লিখুন...">
                </div>
                <div class="form-group">
                    <label>ভিডিওর ধরন বেছে নিন</label>
                    <select id="vidType">
                        <option value="profile">Profile ভিডিও (প্রোফাইলে দেখাবে)</option>
                        <option value="qr">QR Code ভিডিও (QR কোড তৈরি হবে + ৩০ দিন মেয়াদ)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ভিডিও লিংক / Direct MP4 URL (প্লে করার জন্য)</label>
                    <input type="url" id="vidUrl" placeholder="https://example.com/video.mp4">
                </div>
                <div class="form-group">
                    <label>অথবা ভিডিও ফাইল নির্বাচন করুন (ঐচ্ছিক)</label>
                    <input type="file" id="vidFile" accept="video/*">
                </div>
                <button type="button" id="uploadSubmitBtn" class="btn btn-primary" onclick="handleUpload()">ভিডিও প্রকাশ করুন</button>

                <div id="uploadProgressBox" class="upload-progress-box">
                    <div class="upload-progress-top">
                        <span id="uploadStatusText">আপলোড শুরু হচ্ছে...</span>
                        <span id="uploadPercentText">0%</span>
                    </div>
                    <div class="upload-progress-track">
                        <div id="uploadProgressFill" class="upload-progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <h3 style="margin-bottom: 12px; margin-top: 14px; color: var(--primary-dark);">আপলোডকৃত ভিডিওসমূহ</h3>
        <div class="dash-compact-grid" id="adminVideoGrid"></div>
    </div>

    <div id="deleteConfirmModal" class="glass-modal-backdrop">
        <div class="glass-modal-box">
            <h3 style="color: var(--danger); margin-bottom: 6px;">ভিডিও ডিলিট নিশ্চিত করুন</h3>
            <p id="deleteModalText" style="font-size: 13px; color: var(--text); margin-bottom: 16px;">
                এই ভিডিওটি ডিলিট করতে চান?
            </p>
            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button type="button" class="btn btn-glass btn-sm" style="color: var(--text); border-color: #cbd5e1;" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteVideo()">Delete</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script>
        let cachedVideos = [];
        let pendingDeleteId = null;

        if (typeof fbAuth !== "undefined" && fbAuth) {
            fbAuth.onAuthStateChanged(async (user) => {
                if (!user || (typeof isAdminUser === "function" && !isAdminUser(user))) {
                    sessionStorage.removeItem("ia_is_admin");
                    window.location.href = "admin.html";
                    return;
                }
                sessionStorage.setItem("ia_is_admin", "true");
                document.getElementById("activeAdminEmailText").innerText = "লগইন অ্যাকাউন্ট: " + user.email;
                await loadDashboardData();
            });
        } else {
            window.location.href = "admin.html";
        }

        async function loadDashboardData() {
            if (!fbDb) return;
            try {
                const vidSnap = await fbDb.collection("videos").orderBy("createdAt", "desc").get();
                cachedVideos = vidSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (e) {
                const vidSnap = await fbDb.collection("videos").get();
                cachedVideos = vidSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            }

            let followerCount = 0;
            try {
                const fSnap = await fbDb.collection("followers").get();
                followerCount = fSnap.size;
            } catch (e) {
                followerCount = 0;
            }

            document.getElementById("dashVideoCount").innerText = cachedVideos.length;
            document.getElementById("dashFollowerCount").innerText = followerCount;
            renderAdminVideos();
        }

        function toggleSection(sectionId) {
            const el = document.getElementById(sectionId);
            if (el) el.classList.toggle("open");
        }

        async function logoutAdmin() {
            sessionStorage.removeItem("ia_is_admin");
            if (typeof signOutUser === "function") {
                await signOutUser();
            }
            window.location.href = "admin.html";
        }

        function toggleQrMenu(videoId) {
            const drawer = document.getElementById("qr-drawer-" + videoId);
            if (drawer) drawer.classList.toggle("open");
        }

        function setUploadProgress(percent, statusText) {
            const box = document.getElementById("uploadProgressBox");
            const fill = document.getElementById("uploadProgressFill");
            const pctEl = document.getElementById("uploadPercentText");
            const statusEl = document.getElementById("uploadStatusText");
            box.classList.add("active");
            const safePct = Math.max(0, Math.min(100, Math.round(percent)));
            fill.style.width = safePct + "%";
            pctEl.innerText = safePct + "%";
            if (statusText) statusEl.innerText = statusText;
        }

        async function handleUpload() {
            const title = document.getElementById("vidTitle").value.trim();
            const type = document.getElementById("vidType").value;
            const urlInput = document.getElementById("vidUrl").value.trim();
            const fileInput = document.getElementById("vidFile");
            const btn = document.getElementById("uploadSubmitBtn");

            if (!title) {
                alert("ভিডিওর শিরোনাম লিখুন!");
                return;
            }
            if (!fbDb) {
                alert("Firestore সংযোগ পাওয়া যায়নি।");
                return;
            }

            const selectedFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
            const vidId = "vid_" + Date.now();

            btn.disabled = true;
            setUploadProgress(20, "তথ্য যাচাই হচ্ছে...");

            try {
                setUploadProgress(55, "Firestore ডাটাবেসে পাঠানো হচ্ছে...");
                await fbDb.collection("videos").doc(vidId).set({
                    id: vidId,
                    title: title,
                    type: type,
                    videoUrl: urlInput || "",
                    fileName: selectedFile ? selectedFile.name : "",
                    hidden: false,
                    createdAt: Date.now()
                });

                setUploadProgress(100, "✓ ১০০% আপলোড সম্পন্ন হয়েছে!");
                document.getElementById("vidTitle").value = "";
                document.getElementById("vidUrl").value = "";
                fileInput.value = "";
                await loadDashboardData();
            } catch (err) {
                setUploadProgress(0, "✕ আপলোড ব্যর্থ হয়েছে: " + (err && err.message ? err.message : "আবার চেষ্টা করুন"));
            } finally {
                btn.disabled = false;
            }
        }

        async function toggleVideoVisibility(id) {
            const target = cachedVideos.find(v => v.id === id);
            if (!target || !fbDb) return;
            await fbDb.collection("videos").doc(id).update({ hidden: !target.hidden });
            await loadDashboardData();
        }

        function deleteVideo(id) {
            const target = cachedVideos.find(v => v.id === id);
            pendingDeleteId = id;
            document.getElementById("deleteModalText").innerText = target
                ? `"${target.title}" ভিডিওটি ডিলিট করতে চান?`
                : "এই ভিডিওটি ডিলিট করতে চান?";
            document.getElementById("deleteConfirmModal").classList.add("open");
        }

        function closeDeleteModal() {
            pendingDeleteId = null;
            document.getElementById("deleteConfirmModal").classList.remove("open");
        }

        async function confirmDeleteVideo() {
            if (!pendingDeleteId || !fbDb) return;
            const idToRemove = pendingDeleteId;
            closeDeleteModal();
            await fbDb.collection("videos").doc(idToRemove).delete();
            await loadDashboardData();
        }

        function renderAdminVideos() {
            const grid = document.getElementById("adminVideoGrid");
            grid.innerHTML = "";

            if (cachedVideos.length === 0) {
                grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><p style="color: var(--muted);">এখনো কোনো ভিডিও আপলোড করা হয়নি।</p></div>`;
                return;
            }

            cachedVideos.forEach((vid) => {
                const card = document.createElement("div");
                card.className = "dash-mini-card";

                let badges = vid.type === "qr"
                    ? `<span class="badge badge-qr">QR (৩০ দিন)</span>`
                    : `<span class="badge badge-profile">Profile</span>`;
                if (vid.hidden) badges += ` <span class="badge badge-hidden">Hidden</span>`;

                const qrIconButtonHtml = vid.type === "qr" ? `
                    <button type="button" class="qr-icon-btn" title="QR Menu" onclick="toggleQrMenu('${vid.id}')">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm10 0h2v2h-2v-2zm4 0h2v4h-2v-4zm-4 4h2v2h-2v-2zm2 2h4v2h-4v-2z"/>
                        </svg>
                    </button>
                ` : "";

                const qrDrawerHtml = vid.type === "qr" ? `
                    <div id="qr-drawer-${vid.id}" class="qr-menu-drawer">
                        <div style="font-size: 11px; font-weight: 700; color: #0f766e;">QR Menu</div>
                        <div class="qr-mini-frame">
                            <div id="qrcode-${vid.id}"></div>
                        </div>
                        <div>
                            <a href="video.html?v=${vid.id}" target="_blank" class="btn btn-primary btn-sm">খুলুন</a>
                        </div>
                    </div>
                ` : "";

                const mediaHtml = vid.videoUrl
                    ? `<video class="dash-mini-video" src="${vid.videoUrl}" controls playsinline preload="metadata"></video>`
                    : `<div class="dash-mini-video" style="display:flex;align-items:center;justify-content:center;color:#e2e8f0;font-size:11px;padding:8px;text-align:center;">
                        ${vid.fileName || "ভিডিও লিংক নেই"}
                       </div>`;

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="dash-title-row">
                        <div class="dash-mini-title" title="${vid.title}">${vid.title}</div>
                        ${qrIconButtonHtml}
                    </div>
                    <div>${badges}</div>
                    ${qrDrawerHtml}
                    <div class="dash-mini-footer">
                        <span style="font-size: 11px; color: var(--muted);">স্ট্যাটাস: <strong>${vid.hidden ? "Off" : "On"}</strong></span>
                        <button type="button" class="btn btn-sm ${vid.hidden ? "btn-success" : "btn-primary"}" style="width: 100%;" onclick="toggleVideoVisibility('${vid.id}')">
                            ${vid.hidden ? "On করুন" : "Hide করুন"}
                        </button>
                        <button type="button" class="btn btn-sm btn-danger" style="width: 100%;" onclick="deleteVideo('${vid.id}')">
                            Delete
                        </button>
                    </div>
                `;
                grid.appendChild(card);

                if (vid.type === "qr") {
                    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
                    const fullVideoUrl = baseUrl + "video.html?v=" + vid.id;
                    new QRCode(document.getElementById("qrcode-" + vid.id), {
                        text: fullVideoUrl,
                        width: 82,
                        height: 82,
                        colorDark: "#0f172a",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            });
        }
    </script>
</body>
</html>
