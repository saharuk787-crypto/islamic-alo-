<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic alo - Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-login-box {
            max-width: 440px;
            margin: 24px auto;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }
        .admin-login-top {
            background: linear-gradient(135deg, #115e59, #0f766e);
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
        }
        .admin-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.16);
            color: #fef3c7;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.7px;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
        }
        .admin-login-body {
            padding: 24px 20px;
            text-align: center;
        }
        .google-login-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
        }
        .google-login-btn:hover {
            background: #f8fafc;
        }
        .helper-note {
            font-size: 12px;
            color: #64748b;
            margin-top: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="brand">Islamic alo</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-login-box">
            <div class="admin-login-top">
                <div class="admin-badge">ADMIN PORTAL</div>
                <h2 style="font-size: 22px;">Islamic alo</h2>
                <p style="font-size: 12px; opacity: 0.9; margin-top: 4px;">
                    ভিডিও, QR কোড ও ফলোয়ার নিয়ন্ত্রণ প্যানেল
                </p>
            </div>

            <div class="admin-login-body">
                <button type="button" id="googleAdminBtn" class="google-login-btn" onclick="handleGoogleAdminLogin()">
                    <span>Google দিয়ে Admin Login করুন</span>
                </button>
                <p id="loginError" style="color: var(--danger, #dc2626); font-size: 13px; margin-top: 12px; text-align: center;"></p>
                <p class="helper-note">
                    শুধুমাত্র অনুমোদিত অ্যাডমিন Google অ্যাকাউন্ট দিয়ে Dashboard-এ প্রবেশ করা যাবে।
                </p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script>
        const errorEl = document.getElementById("loginError");
        const loginBtn = document.getElementById("googleAdminBtn");

        if (typeof fbAuth !== "undefined" && fbAuth) {
            fbAuth.onAuthStateChanged((user) => {
                if (user && typeof isAdminUser === "function" && isAdminUser(user)) {
                    sessionStorage.setItem("ia_is_admin", "true");
                    window.location.href = "dashboard.html";
                }
            });
        }

        async function handleGoogleAdminLogin() {
            errorEl.innerText = "";
            if (typeof signInWithGoogle !== "function") {
                errorEl.innerText = "Firebase Auth লোড হয়নি। পেজটি রিফ্রেশ করুন।";
                return;
            }
            loginBtn.disabled = true;
            loginBtn.style.opacity = "0.7";
            try {
                const result = await signInWithGoogle();
                const user = result && result.user;
                if (user && isAdminUser(user)) {
                    sessionStorage.setItem("ia_is_admin", "true");
                    window.location.href = "dashboard.html";
                } else {
                    if (typeof signOutUser === "function") {
                        await signOutUser();
                    }
                    sessionStorage.removeItem("ia_is_admin");
                    errorEl.innerText = "এই Google অ্যাকাউন্টটি Admin হিসেবে অনুমোদিত নয়।";
                }
            } catch (err) {
                errorEl.innerText = "লগইনে সমস্যা হয়েছে: " + (err && err.message ? err.message : "আবার চেষ্টা করুন");
            } finally {
                loginBtn.disabled = false;
                loginBtn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
